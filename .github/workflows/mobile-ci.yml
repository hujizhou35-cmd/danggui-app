name: Mobile CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 28.2.13676358
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  android-linux:
    name: Analyze, test, APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-release' || 'ci' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize executable bits from Windows-authored commits
        run: chmod +x android/gradlew tool/*.sh

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            echo "sdkmanager not executable: ${sdkmanager_bin}" >&2
            exit 1
          fi
          "${sdkmanager_bin}" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Disable tool analytics
        shell: bash
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce offline-only boundary
        run: dart run tool/audit_offline_boundary.dart

      - name: Test Android certificate report parser
        run: bash tool/verify_android_artifacts.sh --self-test

      - name: Test exact public release asset contract
        run: |
          bash tool/assemble_release_assets.sh --self-test
          bash tool/render_release_notes.sh --self-test

      - name: Test Android emulator retry gate
        run: bash integration_test/run_android_emulator_smoke_self_test.sh

      - name: Test Android emulator infrastructure gate
        run: bash integration_test/android_emulator_infrastructure_self_test.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        # Keep Argon2id backup checks and large-dataset performance gates from
        # competing across test isolates so the release signal is repeatable.
        run: flutter test --reporter expanded --concurrency=1

      - name: Upload Golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danggui-golden-failures-${{ runner.os }}-${{ github.sha }}
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure protected release signing or explicit debug fallback
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail

          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          provided=0
          for name in "${required[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              provided=$((provided + 1))
            fi
          done

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if (( provided != 0 )); then
              echo "Pull-request jobs must not receive Android signing secrets." >&2
              exit 1
            fi
            echo "ANDROID_SIGNING_MODE=debug-fallback" >> "${GITHUB_ENV}"
            echo "Pull-request artifacts use the debug key; release secrets remain environment-isolated."
            exit 0
          fi

          if (( provided > 0 && provided < ${#required[@]} )); then
            echo "Release signing secrets are only partially configured." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* && provided -ne ${#required[@]} ]]; then
            echo "Version tags require all release signing secrets; debug fallback is forbidden." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* && -z "${ANDROID_EXPECTED_CERT_SHA256:-}" ]]; then
            echo "Version tags require ANDROID_EXPECTED_CERT_SHA256." >&2
            exit 1
          fi

          if (( provided == ${#required[@]} )); then
            keystore_path="${RUNNER_TEMP}/danggui-release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            chmod 600 "${keystore_path}"
            {
              echo "DANGGUI_KEYSTORE_PATH=${keystore_path}"
              echo "DANGGUI_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "DANGGUI_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "DANGGUI_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
              echo "DANGGUI_EXPECTED_CERT_SHA256=${ANDROID_EXPECTED_CERT_SHA256}"
              echo "ANDROID_SIGNING_MODE=release"
            } >> "${GITHUB_ENV}"
          else
            echo "ANDROID_SIGNING_MODE=debug-fallback" >> "${GITHUB_ENV}"
            echo "No release signing secrets supplied; CI artifacts will use the debug key."
          fi

      - name: Build universal and split APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Install pinned bundletool verifier
        shell: bash
        run: |
          set -euo pipefail
          bundletool_jar="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${bundletool_jar}" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          printf '%s  %s\n' "${BUNDLETOOL_SHA256}" "${bundletool_jar}" \
            | sha256sum --check --strict
          echo "BUNDLETOOL_JAR=${bundletool_jar}" >> "${GITHUB_ENV}"
          java -jar "${bundletool_jar}" version

      - name: Stage and verify Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          technical_version="$(sed -n -E 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ "${technical_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+([1-9][0-9]*)$ ]]; then
            version_code="${BASH_REMATCH[1]}"
          else
            echo "Invalid pubspec release version: ${technical_version}" >&2
            exit 65
          fi
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/android/danggui-android-universal-${ANDROID_SIGNING_MODE}.apk"

          declare -A split_version_offsets=(
            [armeabi-v7a]=1000
            [arm64-v8a]=2000
            [x86_64]=4000
          )
          for abi in armeabi-v7a arm64-v8a x86_64; do
            source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [[ ! -f "${source}" ]]; then
              echo "Expected split APK was not generated: ${source}" >&2
              exit 1
            fi
            cp "${source}" "dist/android/danggui-android-${abi}-${ANDROID_SIGNING_MODE}.apk"
          done

          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/android/danggui-android-${ANDROID_SIGNING_MODE}.aab"

          bash tool/verify_android_artifacts.sh \
            "dist/android/danggui-android-universal-${ANDROID_SIGNING_MODE}.apk" \
            "dist/android/danggui-android-${ANDROID_SIGNING_MODE}.aab" \
            "${version_code}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            offset="${split_version_offsets[$abi]}"
            bash tool/verify_android_artifacts.sh \
              "dist/android/danggui-android-${abi}-${ANDROID_SIGNING_MODE}.apk" \
              "" \
              "$((offset + version_code))"
          done

          (
            cd dist/android
            sha256sum ./*.apk ./*.aab > SHA256SUMS
            printf '%s\n' "${ANDROID_SIGNING_MODE}" > SIGNING_MODE.txt
            "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" \
              verify --verbose --print-certs \
              "danggui-android-universal-${ANDROID_SIGNING_MODE}.apk" \
              > SIGNING_CERTIFICATE.txt
            if [[ -n "${DANGGUI_EXPECTED_CERT_SHA256:-}" ]]; then
              printf '%s\n' "${DANGGUI_EXPECTED_CERT_SHA256}" \
                > SIGNING_CERTIFICATE_SHA256.txt
            fi
            flutter --version > TOOLCHAIN.txt
          )

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danggui-android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/danggui-release.jks"

  android-emulator-smoke:
    # Keep these display names stable: main branch protection requires them.
    name: Android cold-start smoke (API ${{ matrix.api-level }})
    needs: [android-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    steps:
      - name: Initialize emulator acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/danggui-emulator-api-${{ matrix.api-level }}"
          mkdir -p "${evidence_dir}"
          printf '%s\n' \
            '{"status":"initialized","phase":"workflow-started"}' \
            > "${evidence_dir}/workflow-phase.json"
          printf '%s\n' \
            '{"status":"not-captured","phase":"before-overlay-install"}' \
            > "${evidence_dir}/before.json"
          printf '%s\n' \
            '{"status":"not-captured","phase":"after-overlay-install"}' \
            > "${evidence_dir}/after.json"
          printf '%s\n' 'not captured' \
            > "${evidence_dir}/notification-before.txt"
          printf '%s\n' 'not captured' \
            > "${evidence_dir}/notification-after.txt"
          : > "${evidence_dir}/notification-shade.png"
          printf '%s\n' \
            '{"status":"not-run","phase":"awaiting-android-artifact"}' \
            > "${evidence_dir}/release-binary-smoke.json"
          : > "${evidence_dir}/release-binary-apk.sha256"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact Android release-mode artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: danggui-android-${{ github.sha }}
          path: ${{ runner.temp }}/danggui-android-${{ github.sha }}
          digest-mismatch: error

      - name: Verify and select universal release-mode APK
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/danggui-android-${GITHUB_SHA}"
          evidence_dir="${RUNNER_TEMP}/danggui-emulator-api-${{ matrix.api-level }}"
          signing_mode="$(tr -d '\r\n' < "${artifact_dir}/SIGNING_MODE.txt")"
          if [[ "${signing_mode}" != 'release' &&
                "${signing_mode}" != 'debug-fallback' ]]; then
            echo "Unsupported downloaded signing mode: ${signing_mode}" >&2
            exit 1
          fi
          release_apk="${artifact_dir}/danggui-android-universal-${signing_mode}.apk"
          [[ -s "${release_apk}" ]]
          (
            cd "${artifact_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          release_apk_sha256="$(sha256sum "${release_apk}" | awk '{print $1}')"
          printf '%s  %s\n' \
            "${release_apk_sha256}" "$(basename -- "${release_apk}")" \
            > "${evidence_dir}/release-binary-apk.sha256"
          printf '%s\n' \
            "DANGGUI_RELEASE_APK=${release_apk}" \
            "DANGGUI_RELEASE_APK_SHA256=${release_apk_sha256}" \
            "DANGGUI_RELEASE_SIGNING_MODE=${signing_mode}" \
            "DANGGUI_RELEASE_ARTIFACT_SHA=${GITHUB_SHA}" \
            >> "${GITHUB_ENV}"

      - name: Normalize executable bits from Windows-authored commits
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked Android build SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            echo "sdkmanager not executable: ${sdkmanager_bin}" >&2
            exit 1
          fi
          "${sdkmanager_bin}" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure toolchain and resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get --enforce-lockfile

      - name: Enable emulator-only Flutter VM service transport
        shell: bash
        run: |
          set -euo pipefail
          # Flutter's device test host needs a loopback VM-service connection.
          # This manifest exists only in the ephemeral emulator checkout; every
          # committed app variant and every verified release artifact remains
          # free of INTERNET permission.
          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET"/>' \
            '</manifest>' \
            > android/app/src/debug/AndroidManifest.xml

      # KVM setup recommended by ReactiveCircus for hardware-accelerated Linux runners.
      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run primary instrumented acceptance and exact release-binary smoke on API ${{ matrix.api-level }}
        id: emulator-primary
        continue-on-error: true
        # ReactiveCircus/android-emulator-runner v2.38.0, pinned to its immutable commit.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ANDROID_SERIAL: emulator-5554
          DANGGUI_EMULATOR_ATTEMPT: "1"
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          avd-name: danggui-api-${{ matrix.api-level }}-attempt-1
          force-avd-creation: true
          emulator-port: 5554
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: bash integration_test/run_android_emulator_smoke.sh "${{ matrix.api-level }}"

      - name: Classify primary emulator failure
        id: fresh-avd-retry
        if: always() && steps.emulator-primary.outcome == 'failure'
        shell: bash
        run: >-
          bash integration_test/android_emulator_retry_gate.sh prepare
          "${{ matrix.api-level }}"

      - name: Run sole fresh-AVD interaction and release-binary retry on API ${{ matrix.api-level }}
        id: emulator-retry
        if: >-
          always() &&
          steps.fresh-avd-retry.outputs.retry-authorized == 'true'
        # This is intentionally a second invocation of the same pinned action.
        # Its unique AVD name and port, plus forced creation and no snapshots,
        # make it a complete emulator rebuild rather than an in-place retry.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ANDROID_SERIAL: emulator-5556
          DANGGUI_EMULATOR_ATTEMPT: "2"
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          avd-name: danggui-api-${{ matrix.api-level }}-attempt-2
          force-avd-creation: true
          emulator-port: 5556
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: bash integration_test/run_android_emulator_smoke.sh "${{ matrix.api-level }}"

      - name: Enforce emulator acceptance result
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.emulator-primary.outcome }}
          RETRY_AUTHORIZED: ${{ steps.fresh-avd-retry.outputs.retry-authorized }}
          RETRY_OUTCOME: ${{ steps.emulator-retry.outcome }}
        run: >-
          bash integration_test/android_emulator_retry_gate.sh enforce
          "${{ matrix.api-level }}" "${PRIMARY_OUTCOME}"
          "${RETRY_AUTHORIZED}" "${RETRY_OUTCOME}"

      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danggui-emulator-api-${{ matrix.api-level }}-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/danggui-emulator-api-${{ matrix.api-level }}/
          if-no-files-found: error
          retention-days: 14

  ios-unsigned:
    name: Unsigned iOS source build
    runs-on: macos-26
    timeout-minutes: 60
    needs: [android-linux, android-emulator-smoke]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build deterministic iOS source archive
        run: bash tool/build_ios_source_zip.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure toolchain
        shell: bash
        run: |
          flutter config --no-analytics --enable-swift-package-manager
          dart --disable-analytics
          xcodebuild -version
          flutter --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        run: bash tool/build_ios_unsigned.sh

      - name: Finalize iOS archive checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/ios
            shasum -a 256 ./*.zip > SHA256SUMS
          )

      - name: Upload unsigned iOS build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danggui-ios-unsigned-${{ github.sha }}
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Publish protected tag pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [android-linux, android-emulator-smoke, ios-unsigned]
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag against pubspec and protected main
        shell: bash
        run: |
          set -euo pipefail
          technical_version="$(sed -n -E 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          version_name="${technical_version%%+*}"
          if [[ "${GITHUB_REF_NAME}" != "v${version_name}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec ${technical_version}." >&2
            exit 1
          fi
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" refs/remotes/origin/main; then
            echo "Tag commit ${tag_commit} is not reachable from protected origin/main." >&2
            exit 1
          fi

      - name: Download gated build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/android staging/ios release
          gh run download "${GITHUB_RUN_ID}" \
            --name "danggui-android-${GITHUB_SHA}" \
            --dir staging/android
          gh run download "${GITHUB_RUN_ID}" \
            --name "danggui-ios-unsigned-${GITHUB_SHA}" \
            --dir staging/ios

      - name: Assemble pre-release assets
        shell: bash
        run: |
          set -euo pipefail
          bash tool/assemble_release_assets.sh \
            "${GITHUB_REF_NAME}" staging/android staging/ios release
          bash tool/render_release_notes.sh \
            "${GITHUB_REF_NAME}" \
            "docs/release/notes/${GITHUB_REF_NAME}.md" \
            staging/android/SIGNING_CERTIFICATE_SHA256.txt \
            release-notes.md

      - name: Create or refresh GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          release_title="$(
            sed -n -E 's/^#[[:space:]]+(.+)$/\1/p' release-notes.md |
              head -n 1
          )"
          [[ -n "${release_title}" ]]
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          mapfile -t expected_assets < <(
            printf '%s\n' "${assets[@]##*/}" | sort
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            existing_is_prerelease="$(
              gh release view "${GITHUB_REF_NAME}" \
                --json isPrerelease --jq '.isPrerelease'
            )"
            if [[ "${existing_is_prerelease}" != 'true' ]]; then
              echo "Refusing to replace assets on an already-promoted stable release." >&2
              exit 1
            fi

            # Upload the complete verified set first. Only after every expected
            # asset succeeds do we remove stale files from an older contract.
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            mapfile -t existing_assets < <(
              gh release view "${GITHUB_REF_NAME}" \
                --json assets --jq '.assets[].name'
            )
            for asset_name in "${existing_assets[@]}"; do
              if ! printf '%s\n' "${expected_assets[@]}" |
                grep -Fqx -- "${asset_name}"; then
                gh release delete-asset "${GITHUB_REF_NAME}" \
                  "${asset_name}" --yes
              fi
            done
            gh release edit "${GITHUB_REF_NAME}" \
              --prerelease \
              --title "${release_title}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --prerelease \
              --title "${release_title}" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi
          mapfile -t published_assets < <(
            gh release view "${GITHUB_REF_NAME}" \
              --json assets --jq '.assets[].name' | sort
          )
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}") \
            <(printf '%s\n' "${published_assets[@]}")

          published_verification="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" \
            --pattern SHA256SUMS \
            --dir "${published_verification}"
          cmp release/SHA256SUMS "${published_verification}/SHA256SUMS"
